name: Sync blueprint landscape

# Keeps the service-landscape table in docs/blueprints.md in step with the org's
# public repos. Runs weekly and on demand; commits only when the table changed.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:


permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-landscape
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Regenerate landscape
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/sync-landscape.sh

      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- docs/blueprints.md; then
            echo "Landscape already up to date."
            exit 0
          fi
          branch="chore/sync-landscape-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "docs: sync blueprint landscape" -- docs/blueprints.md
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs: sync blueprint landscape" \
            --body "Automated resync of the service landscape in \`docs/blueprints.md\`."
